<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"><title>Lum 启动标志</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Segoe UI','Microsoft YaHei',sans-serif}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:reveal .9s ease-out both}.brand{position:relative;width:390px;height:260px;display:grid;place-items:center}.brand:before{content:'';position:absolute;inset:48px 20px;border-radius:50%;background:radial-gradient(ellipse,#ffffffb3,transparent 70%);filter:blur(18px)}img{position:relative;width:390px;height:260px;object-fit:contain;filter:drop-shadow(0 2px 2px #ffffff80) drop-shadow(0 8px 16px #0002)}.caption{padding:14px 24px 15px;border-radius:22px;background:#18181880;color:#f7f7f5;text-align:center;box-shadow:inset 0 1px 0 #ffffff1c}h1{font-size:17px;font-weight:500;letter-spacing:.08em;margin:0}p{font-size:10px;letter-spacing:.06em;color:#e0e0e0;margin:8px 0 0}.progress{height:3px;width:76px;background:#ffffff25;border-radius:3px;overflow:hidden;margin:15px auto 0}.progress:after{content:'';display:block;height:100%;width:30px;background:#e9e9eb;border-radius:3px;animation:travel 1.5s ease-in-out infinite}@keyframes reveal{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}@keyframes travel{from{transform:translateX(-30px)}to{transform:translateX(76px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.progress:after{transform:translateX(23px)}}
</style></head><body><main><div class="brand"><img src="lumLogo.png" alt="Lum 影纪"></div><div class="caption"><h1>让想象先成为画面</h1><p lang="en">Trace the light, record the scene</p><div class="progress" aria-label="正在开启创作空间"></div></div></main></body></html>
